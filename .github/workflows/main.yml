name: Android CI and Release

on:
  pull_request:
    branches: [main, master]
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-test-apk:
    name: Build downloadable test APKs
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get

      - name: Configure Firebase and upload signing
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Add GOOGLE_SERVICES_JSON_BASE64 to repository Actions secrets}"
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Add ANDROID_UPLOAD_KEYSTORE_BASE64 to repository Actions secrets}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build release APKs
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_UPLOAD_STORE_FILE }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-number="${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-latest-apks:
    name: Update latest main APK release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-apk
    runs-on: ubuntu-latest
    concurrency:
      group: latest-main-apk-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks-${{ github.sha }}
          path: release-apks

      - name: Skip stale builds and update rolling tag
        id: latest
        run: |
          set -euo pipefail
          git fetch origin main
          latest_main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping stale build for $GITHUB_SHA; main is now at $latest_main_sha."
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is_current=true" >> "$GITHUB_OUTPUT"
          git push --force origin "$GITHUB_SHA:refs/tags/latest"

      - name: Publish APKs to rolling GitHub Release
        if: steps.latest.outputs.is_current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest main build
          body: Automated split APKs from main commit ${{ github.sha }}.
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-apks/app-arm64-v8a-release.apk
            release-apks/app-armeabi-v7a-release.apk
            release-apks/app-x86_64-release.apk

  release-play-aab:
    name: Build and publish Play Store AAB
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: versioned-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get

      - name: Configure Firebase and upload signing
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Add GOOGLE_SERVICES_JSON_BASE64 to repository Actions secrets}"
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Add ANDROID_UPLOAD_KEYSTORE_BASE64 to repository Actions secrets}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Derive Android version and release tag
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          tag_pattern = re.compile(r"v(\d+)\.(\d+)\.(\d+)")

          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              release_tag = os.environ["GITHUB_REF_NAME"]
              match = tag_pattern.fullmatch(release_tag)
              if match is None:
                  raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3.")
              major, minor, patch = map(int, match.groups())
          else:
              subprocess.run(["git", "fetch", "--force", "--tags", "origin"], check=True)
              tags = subprocess.check_output(
                  ["git", "tag", "--list", "v*"],
                  text=True,
              ).splitlines()
              versions = []
              for existing_tag in tags:
                  match = tag_pattern.fullmatch(existing_tag)
                  if match is not None:
                      version = tuple(map(int, match.groups()))
                      commit = subprocess.check_output(
                          ["git", "rev-parse", f"{existing_tag}^{{commit}}"],
                          text=True,
                      ).strip()
                      if commit == os.environ["GITHUB_SHA"]:
                          versions.append(version)

              if versions:
                  major, minor, patch = max(versions)
              else:
                  stable_versions = [
                      tuple(map(int, match.groups()))
                      for existing_tag in tags
                      if (match := tag_pattern.fullmatch(existing_tag)) is not None
                  ]
                  if not stable_versions:
                      raise SystemExit("Cannot auto-increment: no existing stable vMAJOR.MINOR.PATCH tag was found.")
                  major, minor, patch = max(stable_versions)
                  patch += 1
              release_tag = f"v{major}.{minor}.{patch}"

          if major > 2099 or minor > 999 or patch > 999:
              raise SystemExit("Version components exceed the supported Android version-code range.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"APP_VERSION={major}.{minor}.{patch}\n")
              env_file.write(f"APP_BUILD_NUMBER={major * 1_000_000 + minor * 1_000 + patch + 1}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"release_tag={release_tag}\n")
          PY

      - name: Build signed Play Store app bundle
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_UPLOAD_STORE_FILE }}
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER"

      - name: Build signed split APKs
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_UPLOAD_STORE_FILE }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: play-store-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
