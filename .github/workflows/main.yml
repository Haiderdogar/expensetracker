name: Android CI and Release

on:
  pull_request:
    branches: [main, master]
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-test-apk:
    name: Build downloadable test APKs
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get

      - name: Configure Firebase and upload signing
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Add GOOGLE_SERVICES_JSON_BASE64 to repository Actions secrets}"
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Add ANDROID_UPLOAD_KEYSTORE_BASE64 to repository Actions secrets}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build release APKs
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_UPLOAD_STORE_FILE }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-number="${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  release-play-aab:
    name: Build and publish Play Store AAB
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get

      - name: Configure Firebase and upload signing
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON_BASE64:?Add GOOGLE_SERVICES_JSON_BASE64 to repository Actions secrets}"
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Add ANDROID_UPLOAD_KEYSTORE_BASE64 to repository Actions secrets}"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Derive Android version from tag
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if match is None:
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3.")

          major, minor, patch = map(int, match.groups())
          if major > 2099 or minor > 999 or patch > 999:
              raise SystemExit("Version components exceed the supported Android version-code range.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"APP_VERSION={major}.{minor}.{patch}\n")
              env_file.write(f"APP_BUILD_NUMBER={major * 1_000_000 + minor * 1_000 + patch + 1}\n")
          PY

      - name: Build signed Play Store app bundle
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_UPLOAD_STORE_FILE }}
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: play-store-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
