name: expensetracker
description: A production-grade expense tracker with secure PIN and offline storage.
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  sqflite: ^2.4.3
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.6.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  currency_picker: ^2.0.22
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.9.0
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.2
  go_router: ^18.0.1
  flutter_native_splash: ^2.4.5
  android_nav_setting: ^0.0.2+1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4

# ── App Launcher Icon ─────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true

# ── Native Splash Screen ──────────────────────────────────────────────────────
flutter_native_splash:
  # Center the app icon on a background that follows the device theme.
  color: "#FFFFFF"
  image: assets/icon.png

  # Dark mode – deep navy canvas
  color_dark: "#111827"
  image_dark: assets/icon.png

  # Android 12+ Splash API
  # Use a smaller, padded logo to fit Android's system splash-icon safe area.
  android_12:
    color: "#FFFFFF"
    image: assets/splash_icon_android12.png
    color_dark: "#111827"
    image_dark: assets/splash_icon_android12.png

  android: true
  ios: false
  web: false


flutter:
  uses-material-design: true
  assets:
    - assets/
