name: expensetracker
description: A production-grade expense tracker with green theme, secure PIN, and offline storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.6.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  file_picker: ^10.3.8
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  flutter_native_splash: ^2.4.5

flutter_native_splash:
  color: "#10B981"
  android_12:
    color: "#10B981"
  ios: true
  android: true

flutter:
  uses-material-design: true
